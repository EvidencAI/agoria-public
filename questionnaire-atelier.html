<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Après l'atelier — EvidencAI</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bleu-nuit: #1a1a2e;
    --corail: #E07A5F;
    --corail-hover: #c96a52;
    --surface: #ffffff;
    --texte-clair: #f8fafc;
    --texte-secondaire: #94a3b8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'DM Sans', system-ui, -apple-system, sans-serif; background: var(--bleu-nuit); color: var(--texte-clair); min-height: 100vh; }
  header { background: var(--bleu-nuit); padding: 20px 32px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .header-left { display: flex; flex-direction: column; align-items: center; }
  .brand-agoria { font-family: 'Playfair Display', Georgia, serif; font-size: 2rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; line-height: 1.1; }
  .brand-agoria .ia { color: var(--corail); }
  .brand-by { font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--texte-secondaire); margin-top: 3px; }
  .container { max-width: 780px; margin: 0 auto; padding: 24px 24px 40px; }
  .welcome { text-align: center; margin-bottom: 20px; }
  .welcome h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.8rem; font-weight: 700; color: var(--texte-clair); margin-bottom: 8px; }
  .welcome .sub { color: var(--texte-secondaire); font-size: 1rem; line-height: 1.5; max-width: 560px; margin: 0 auto; }
  .progress-bar { display: flex; gap: 6px; justify-content: center; margin-top: 14px; }
  .progress-dot { width: 30px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); transition: background 0.3s; }
  .progress-dot.active { background: var(--corail); }
  .step { background: var(--surface); border-radius: 20px; padding: 28px 32px; margin-bottom: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.3); color: #2d2d2d; }
  .step-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--corail); font-weight: 600; margin-bottom: 10px; }
  .step h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 16px; color: var(--bleu-nuit); }
  .step h3 { font-size: 1.05rem; font-weight: 600; margin-top: 20px; margin-bottom: 12px; color: var(--bleu-nuit); }
  .step .hint { font-size: 0.88rem; color: #64748b; margin-bottom: 14px; line-height: 1.5; }
  .option-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .option-card { padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 14px; cursor: pointer; text-align: center; font-size: 1rem; transition: all 0.2s; background: #fff; user-select: none; }
  .option-card:hover { border-color: var(--corail); background: #fef6f4; }
  .option-card.selected { border-color: var(--corail); background: var(--corail); color: #fff; }
  .card-label { font-weight: 600; font-size: 1rem; margin-bottom: 3px; }
  .card-desc { font-size: 0.8rem; color: #64748b; line-height: 1.3; }
  .option-card.selected .card-desc { color: rgba(255,255,255,0.8); }
  .scale-row { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .scale-item { flex: 1; min-width: 42px; padding: 16px 0; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: center; font-size: 1.2rem; font-weight: 700; color: var(--bleu-nuit); transition: all 0.2s; background: #fff; user-select: none; }
  .scale-item:hover { border-color: var(--corail); background: #fef6f4; }
  .scale-item.selected { border-color: var(--corail); background: var(--corail); color: #fff; }
  .scale-legend { display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.82rem; color: #64748b; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 9px; }
  .chip { padding: 9px 18px; border: 2px solid #e2e8f0; border-radius: 24px; cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all 0.2s; user-select: none; color: #334155; }
  .chip:hover { border-color: var(--corail); color: var(--corail); }
  .chip.selected { border-color: var(--corail); background: var(--corail); color: #fff; }
  textarea, select { width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 0.95rem; font-family: 'DM Sans', sans-serif; background: #fff; color: #1e293b; line-height: 1.5; }
  textarea { resize: vertical; min-height: 80px; }
  textarea:focus, select:focus { outline: none; border-color: var(--corail); }
  .nav-btns { display: flex; gap: 14px; justify-content: flex-end; margin-top: 20px; }
  .btn { padding: 13px 30px; border: none; border-radius: 14px; font-size: 1rem; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; }
  .btn-next { background: var(--corail); color: #fff; }
  .btn-next:hover { background: var(--corail-hover); }
  .btn-back { background: transparent; color: var(--corail); border: 2px solid var(--corail); }
  .btn-submit { background: var(--bleu-nuit); color: #fff; font-size: 1.05rem; padding: 16px 40px; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .success-screen, .error-screen, .loader { text-align: center; padding: 60px 24px; }
  .success-screen .check-icon { width: 80px; height: 80px; margin: 0 auto 20px; background: var(--corail); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .success-screen .check-icon svg { width: 40px; height: 40px; stroke: #fff; fill: none; stroke-width: 2.5; }
  .success-screen h2, .error-screen h2 { color: var(--texte-clair); font-family: 'Playfair Display', serif; font-size: 1.6rem; margin-bottom: 12px; }
  .success-screen p, .error-screen p { color: var(--texte-secondaire); line-height: 1.6; font-size: 1.05rem; }
  @media (max-width: 520px) {
    .brand-agoria { font-size: 1.5rem; }
    .container { padding: 20px 16px 32px; }
    .step { padding: 22px 18px; }
    .option-grid { grid-template-columns: 1fr; }
    .scale-item { font-size: 1rem; padding: 12px 0; min-width: 36px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP = document.getElementById('app');
const SESSION_ID = new URLSearchParams(window.location.search).get('session_id');
let currentStep = 0;
let PRENOMS = [];

const SUPABASE_URL = 'https://supabase.evidencai.com';
const SUPABASE_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc3NjE1MDA2MCwiZXhwIjo0OTMxODIzNjYwLCJyb2xlIjoiYW5vbiJ9.LNYYUzroE5n61tMfo1hh06y05MPAhFJ4aWbaPGhwp6k';

async function supabaseGet(path) {
  const resp = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Accept-Profile': 'agoria' }
  });
  return resp.json();
}
async function supabaseInsert(table, row) {
  const resp = await fetch(SUPABASE_URL + '/rest/v1/' + table, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Profile': 'agoria', 'Content-Type': 'application/json', 'Prefer': 'return=representation' },
    body: JSON.stringify(row)
  });
  return resp.json();
}

const TOTAL_STEPS = 7;
const answers = {
  prenom: '', niveau: '', confiance: null, intention: '',
  note_globale: null, moment: '', usage_concret: '', approfondir: [], nps: null, trois_mots: ''
};

const ICONS = { check: '<svg viewBox="0 0 24 24" fill="none"><polyline points="20 6 9 17 4 12"/></svg>' };

const NIVEAUX = [
  { id: 'jamais', label: 'Jamais', desc: "Je n'utilise pas vraiment l'IA" },
  { id: 'simple', label: 'Tâches simples', desc: 'Mails, traductions, résumés' },
  { id: 'projet', label: 'Mode projet', desc: 'Vrai projet, utilisation de skills' },
  { id: 'connecte', label: 'Outils connectés', desc: "L'IA reliée à mes fichiers et outils" },
  { id: 'developpe', label: 'Je développe', desc: 'Vibe coding, Cowork, GitHub' }
];
const FREQUENCES = [
  { id: 'jamais', label: 'Jamais' },
  { id: 'mensuel', label: 'Quelques fois par mois' },
  { id: 'hebdo', label: 'Chaque semaine' },
  { id: 'quotidien', label: 'Tous les jours' }
];
const APPROFONDIR = ['Rédiger mails et documents', 'Résumés et comptes-rendus', 'Visuels et présentations', 'Analyser données et tableaux', "L'IA pour mon métier", "Connecter l'IA à nos outils", 'Autre'];

function headerHTML() {
  return '<header><div class="header-left">'
    + '<span class="brand-agoria">Evidenc<span class="ia">AI</span></span>'
    + '<span class="brand-by">Atelier IA · Chamas Group</span>'
    + '</div></header>';
}

async function init() {
  if (!SESSION_ID) { APP.innerHTML = headerHTML() + '<div class="container"><div class="error-screen"><h2>Lien incomplet</h2><p>Ce lien ne contient pas d\'identifiant de session.</p></div></div>'; return; }
  APP.innerHTML = headerHTML() + '<div class="container"><div class="loader">Chargement...</div></div>';
  try {
    const parts = await supabaseGet('participants?session_id=eq.' + SESSION_ID + '&order=prenom.asc');
    PRENOMS = (parts || []).map(p => p.prenom).filter(Boolean);
    renderWizard();
  } catch (e) {
    APP.innerHTML = headerHTML() + '<div class="container"><div class="error-screen"><h2>Erreur</h2><p>Impossible de charger. Réessayez dans un instant.</p></div></div>';
  }
}

function showSuccess(t, m) {
  APP.innerHTML = headerHTML() + '<div class="container"><div class="success-screen"><div class="check-icon">' + ICONS.check + '</div><h2>' + t + '</h2><p>' + m + '</p></div></div>';
}

function renderWizard() {
  const steps = [step1, step2, step3, step4, step5, step6, step7];
  APP.innerHTML = headerHTML()
    + '<div class="container">'
    + '<div class="welcome"><h1>Merci d\'avoir participé !</h1>'
    + '<p class="sub">Deux minutes pour nous dire ce qui a marché et ce que vous aimeriez creuser. Vos réponses guideront la suite.</p>'
    + '<div class="progress-bar">'
    + steps.map((_, i) => '<div class="progress-dot' + (i <= currentStep ? ' active' : '') + '"></div>').join('')
    + '</div></div>'
    + '<div id="stepContainer"></div></div>';
  steps[currentStep]();
}
function nav(canNext) {
  let h = '<div class="nav-btns">';
  if (currentStep > 0) h += '<button class="btn btn-back" onclick="prevStep()">Précédent</button>';
  if (currentStep < TOTAL_STEPS - 1) h += '<button class="btn btn-next" onclick="nextStep()"' + (canNext ? '' : ' disabled') + '>Suivant</button>';
  else h += '<button class="btn btn-submit" id="submitBtn" onclick="submitForm()">Envoyer</button>';
  return h + '</div>';
}
function nextStep() { currentStep++; renderWizard(); }
function prevStep() { currentStep--; renderWizard(); }

function step1() {
  const c = document.getElementById('stepContainer');
  let opts = '<option value="">Choisissez votre prénom...</option>';
  PRENOMS.forEach(p => { opts += '<option value="' + p + '"' + (answers.prenom === p ? ' selected' : '') + '>' + p + '</option>'; });
  c.innerHTML = '<div class="step"><div class="step-label">Étape 1/' + TOTAL_STEPS + '</div>'
    + '<h2>Qui êtes-vous ?</h2>'
    + '<p class="hint">Pour relier vos réponses à celles d\'avant l\'atelier (données anonymisées ensuite).</p>'
    + '<select id="prenomSel" onchange="answers.prenom=this.value;step1()">' + opts + '</select>'
    + nav(!!answers.prenom) + '</div>';
}
function step2() {
  const c = document.getElementById('stepContainer');
  c.innerHTML = '<div class="step"><div class="step-label">Étape 2/' + TOTAL_STEPS + '</div>'
    + '<h2>Où en êtes-vous avec l\'IA maintenant ?</h2>'
    + '<p class="hint">Après l\'atelier, choisissez la ligne la plus haute qui vous décrit.</p>'
    + '<div class="option-grid">' + NIVEAUX.map(n =>
      '<div class="option-card' + (answers.niveau === n.id ? ' selected' : '') + '" onclick="answers.niveau=\'' + n.id + '\';step2()">'
      + '<div class="card-label">' + n.label + '</div><div class="card-desc">' + n.desc + '</div></div>'
    ).join('') + '</div>' + nav(!!answers.niveau) + '</div>';
}
function step3() {
  const c = document.getElementById('stepContainer');
  let items = '';
  for (let i = 1; i <= 5; i++) items += '<div class="scale-item' + (answers.confiance === i ? ' selected' : '') + '" onclick="answers.confiance=' + i + ';step3()">' + i + '</div>';
  c.innerHTML = '<div class="step"><div class="step-label">Étape 3/' + TOTAL_STEPS + '</div>'
    + '<h2>Votre confiance pour utiliser l\'IA dans votre travail ?</h2>'
    + '<p class="hint">De 1 (pas du tout) à 5 (totalement).</p>'
    + '<div class="scale-row">' + items + '</div>'
    + '<div class="scale-legend"><span>Pas du tout</span><span>Totalement</span></div>'
    + nav(answers.confiance !== null) + '</div>';
}
function step4() {
  const c = document.getElementById('stepContainer');
  c.innerHTML = '<div class="step"><div class="step-label">Étape 4/' + TOTAL_STEPS + '</div>'
    + '<h2>À quelle fréquence pensez-vous utiliser l\'IA maintenant ?</h2>'
    + '<div class="option-grid">' + FREQUENCES.map(f =>
      '<div class="option-card' + (answers.intention === f.id ? ' selected' : '') + '" onclick="answers.intention=\'' + f.id + '\';step4()">'
      + '<div class="card-label">' + f.label + '</div></div>'
    ).join('') + '</div>' + nav(!!answers.intention) + '</div>';
}

function step5() {
  const c = document.getElementById('stepContainer');
  let g = '';
  for (let i = 1; i <= 5; i++) g += '<div class="scale-item' + (answers.note_globale === i ? ' selected' : '') + '" onclick="answers.note_globale=' + i + ';step5()">' + i + '</div>';
  let n = '';
  for (let i = 0; i <= 10; i++) n += '<div class="scale-item' + (answers.nps === i ? ' selected' : '') + '" onclick="answers.nps=' + i + ';step5()">' + i + '</div>';
  c.innerHTML = '<div class="step"><div class="step-label">Étape 5/' + TOTAL_STEPS + '</div>'
    + '<h2>Votre note globale de l\'atelier</h2>'
    + '<p class="hint">De 1 à 5.</p>'
    + '<div class="scale-row">' + g + '</div>'
    + '<h3>Recommanderiez-vous cet atelier à un collègue ?</h3>'
    + '<p class="hint">De 0 (jamais) à 10 (sans hésiter).</p>'
    + '<div class="scale-row">' + n + '</div>'
    + nav(answers.note_globale !== null && answers.nps !== null) + '</div>';
}
function step6() {
  const c = document.getElementById('stepContainer');
  c.innerHTML = '<div class="step"><div class="step-label">Étape 6/' + TOTAL_STEPS + '</div>'
    + '<h2>Ce qui vous a parlé</h2>'
    + '<p class="hint">Le moment ou l\'idée qui vous a le plus marqué pendant l\'atelier.</p>'
    + '<textarea id="momentInput" placeholder="Ex : le moment où on a vu que l\'IA se trompe, la démo sur..." oninput="answers.moment=this.value">' + (answers.moment || '') + '</textarea>'
    + '<h3>Une chose que vous allez essayer</h3>'
    + '<p class="hint">Concrètement, dès cette semaine.</p>'
    + '<textarea id="usageInput" placeholder="Ex : lui faire relire mes mails, résumer un compte-rendu..." oninput="answers.usage_concret=this.value">' + (answers.usage_concret || '') + '</textarea>'
    + nav(true) + '</div>';
}
function step7() {
  const c = document.getElementById('stepContainer');
  c.innerHTML = '<div class="step"><div class="step-label">Étape 7/' + TOTAL_STEPS + '</div>'
    + '<h2>Ce que vous aimeriez creuser</h2>'
    + '<p class="hint">Plusieurs choix possibles. Ça nous aide à préparer les prochains ateliers.</p>'
    + '<div class="chip-grid">' + APPROFONDIR.map(a =>
      '<div class="chip' + (answers.approfondir.includes(a) ? ' selected' : '') + '" onclick="toggleApp(\'' + a.replace(/'/g, "\\'") + '\')">' + a + '</div>'
    ).join('') + '</div>'
    + '<h3>L\'atelier en trois mots</h3>'
    + '<textarea id="motsInput" placeholder="Ex : clair, utile, rassurant" oninput="answers.trois_mots=this.value">' + (answers.trois_mots || '') + '</textarea>'
    + nav(true) + '</div>';
}
function toggleApp(val) {
  const i = answers.approfondir.indexOf(val);
  if (i >= 0) answers.approfondir.splice(i, 1); else answers.approfondir.push(val);
  step7();
}

async function submitForm() {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Envoi...';
  try {
    // coanimation : reutilise pour stocker l'intention d'usage (S3), pas d'Az en atelier
    const res = await supabaseInsert('satisfaction', {
      session_id: SESSION_ID,
      prenom: answers.prenom,
      niveau: answers.niveau,
      confiance: answers.confiance,
      coanimation: answers.intention,
      note_globale: answers.note_globale,
      nps: answers.nps,
      moment_marquant: answers.moment,
      usage_concret: answers.usage_concret,
      approfondir: answers.approfondir.join(', '),
      trois_mots: answers.trois_mots
    });
    if (res && res.length > 0) {
      showSuccess('Merci ' + answers.prenom + ' !', 'Vos retours sont enregistrés. Ils vont directement nourrir la suite pour vos équipes. À bientôt !');
    } else {
      btn.disabled = false; btn.textContent = 'Envoyer'; alert('Une erreur est survenue. Réessayez.');
    }
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Envoyer'; alert('Erreur de connexion. Réessayez.');
  }
}

init();
</script>
</body>
</html>
